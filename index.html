<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 코딩 2주차 실습</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Vibe Coding</p>
      <h1>바이브 코딩 2주차 실습</h1>
      <p class="subtitle">빌드 도구 없이, 순수 HTML · CSS · JS로 만드는 정적 사이트</p>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환">🌙 다크 모드</button>
    </div>
  </header>

  <main>
    <section class="restaurants">
      <h2>내가 좋아하는 맛집 TOP 3</h2>
      <ul class="restaurant-grid">
        <li class="restaurant-card">
          <div class="restaurant-image" aria-hidden="true">🍝</div>
          <span class="restaurant-name">심퍼티쿠시</span>
          <span class="restaurant-location">📍 성수 · 서울숲</span>
        </li>
        <li class="restaurant-card">
          <div class="restaurant-image" aria-hidden="true">🍣</div>
          <span class="restaurant-name">나랑가</span>
          <span class="restaurant-location">📍 망원동 · 성미산로</span>
        </li>
        <li class="restaurant-card">
          <div class="restaurant-image" aria-hidden="true">🥐</div>
          <span class="restaurant-name">판코네</span>
          <span class="restaurant-location">📍 용산 · 한강대로40가길</span>
        </li>
      </ul>
      <a class="back-link" href="restaurants.html">전체 맛집 리스트 보기 →</a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 바이브 코딩 2주차 실습</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
