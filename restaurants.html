<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내가 좋아하는 맛집</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">My Favorites</p>
      <h1>내가 좋아하는 맛집</h1>
      <p class="subtitle">가보고 좋았던 곳들을 모아둔 나만의 맛집 리스트</p>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환">🌙 다크 모드</button>
    </div>
  </header>

  <main>
    <section class="restaurants">
      <h2>맛집 리스트</h2>
      <ul class="restaurant-grid">
        <li class="restaurant-card">
          <img class="restaurant-image" src="https://loremflickr.com/400/300/pasta?lock=1" alt="심퍼티쿠시 이미지" loading="lazy">
          <span class="restaurant-name">심퍼티쿠시</span>
          <span class="restaurant-location">📍 성수 · 서울숲</span>
        </li>
        <li class="restaurant-card">
          <img class="restaurant-image" src="https://loremflickr.com/400/300/noodles?lock=2" alt="나랑가 이미지" loading="lazy">
          <span class="restaurant-name">나랑가</span>
          <span class="restaurant-location">📍 망원동 · 성미산로</span>
        </li>
        <li class="restaurant-card">
          <img class="restaurant-image" src="https://loremflickr.com/400/300/bakery?lock=3" alt="판코네 이미지" loading="lazy">
          <span class="restaurant-name">판코네</span>
          <span class="restaurant-location">📍 용산 · 한강대로40가길</span>
        </li>
        <li class="restaurant-card">
          <img class="restaurant-image" src="https://loremflickr.com/400/300/gelato?lock=12" alt="g.l.t gelato 이미지" loading="lazy">
          <span class="restaurant-name">g.l.t gelato</span>
          <span class="restaurant-location">📍 홍대 · 서교동</span>
        </li>
        <li class="restaurant-card">
          <img class="restaurant-image" src="https://loremflickr.com/400/300/icecream?lock=1" alt="녹기 전에 낱점 이미지" loading="lazy">
          <span class="restaurant-name">녹기 전에 낱점</span>
          <span class="restaurant-location">📍 성북동 · 성북로14길</span>
        </li>
        <li class="restaurant-card">
          <img class="restaurant-image" src="https://loremflickr.com/400/300/cake?lock=6" alt="벌스데이 젤라또 이미지" loading="lazy">
          <span class="restaurant-name">벌스데이 젤라또</span>
          <span class="restaurant-location">📍 잠실 · 송파동</span>
        </li>
      </ul>
    </section>

    <a class="back-link" href="index.html">← 목차로 돌아가기</a>
  </main>

  <footer>
    <p>&copy; 2026 바이브 코딩 2주차 실습</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
